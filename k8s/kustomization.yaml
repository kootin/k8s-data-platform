# Application layer. The namespace, LocalStack, S3 buckets and credentials
# come from Terraform; this deploys Postgres and Airflow on top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-platform

labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-data-platform
    includeSelectors: false

resources:
  - postgres.yaml
  - airflow-env.yaml
  - airflow-scheduler.yaml
  - airflow-webserver.yaml

images:
  - name: k8s-data-platform/airflow
    newTag: local
